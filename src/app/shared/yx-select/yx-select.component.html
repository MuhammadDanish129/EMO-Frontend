<div class="yx-select" [class.yx-select-up]="placement === 'top'">

  <!-- LABEL -->
  <label *ngIf="label" class="yx-label block text-xs font-semibold mb-1">
    {{ label }}
    <span *ngIf="required" class="text-[rgb(var(--red-500))]">*</span>
  </label>

  <!-- TRIGGER -->
  <div
    class="yx-select-trigger"
    [class.yx-error]="error"
    [class.yx-disabled]="disabled"
    (click)="toggle()">

    <input
      *ngIf="enableSearch && open"
      #searchInput
      type="text"
      [(ngModel)]="searchTerm"
      [placeholder]="selectedLabel || placeholder"
      class="yx-select-search-input text-sm"
      (click)="$event.stopPropagation()"
      (keydown)="onSearchKeydown($event)"
    />

    <span *ngIf="!enableSearch || !open" class="text-sm" [class.text-[rgb(var(--text-muted))]]="!selectedLabel">
      {{ selectedLabel || placeholder }}
    </span>

    <i class="las la-angle-down transition-transform" [class.rotate-180]="open"></i>
  </div>

  <!-- DROPDOWN PANEL -->
  <div *ngIf="open" class="yx-select-panel">

    <ng-container *ngIf="filteredItems.length; else noOptions">
      <div
        *ngFor="let item of filteredItems"
        class="yx-select-option"
        [class.yx-selected]="item[valueKey] === value"
        (click)="select(item)">
        {{ item[labelKey] }}
      </div>
    </ng-container>

    <ng-template #noOptions>
      <div class="yx-select-empty">No options found</div>
    </ng-template>

  </div>

  <!-- ERROR -->
  <p *ngIf="error" class="text-xs font-medium text-[rgb(var(--danger))] mt-1">
    {{ error }}
  </p>

</div>
